[metadata]
name = local-sessiondb-public
version = 0.1.0rc1
description = Local search and verifiable retrieval across Claude and Codex coding sessions
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Operating System :: MacOS
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License

[options]
python_requires = >=3.9
package_dir =
    = src
py_modules =
    sessiondb
    full_corpus
    snapshot_export
    freshness_service
install_requires =
    zstandard==0.25.0
    tiktoken==0.11.0
    watchdog==6.0.0

[options.entry_points]
console_scripts =
    sessiondb = sessiondb:main
    sessiondb-admin = full_corpus:main
    sessiondb-export = snapshot_export:main
    sessiondb-freshness = freshness_service:main
